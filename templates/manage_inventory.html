{% extends "base.html" %}

{% block content %}
    <h1>Manage Inventory</h1>
    
    <form method="post" action="" enctype="multipart/form-data">
        <input type="file" name="file" accept=".csv">
        <button type="submit">Upload CSV</button>
    </form>

    <!-- Button to Clear Warehouse Inventory -->
    <form method="POST" action="{{ url_for('clear_warehouse_inventory') }}" style="margin-top: 10px;">
        <button type="submit" style="background-color: #f44336; color: white;">Clear Warehouse Inventory</button>
    </form>
    
    <table>
        <thead>
            <tr>
                <th>Item Name</th>
                <th>Category</th>
                <th>Current Stock</th>
                <th>Price</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
            {% for item in items %}
            <tr>
                <td>{{ item.name }}</td>
                <td>{{ item.category }}</td>
                <td>{{ item.current_stock }}</td>
                <td>{{ item.price }}</td>
                <td>
                    <a href="{{ url_for('edit_stock', stock_id=item.id) }}">Edit</a>
                    <a href="{{ url_for('delete_stock', stock_id=item.id) }}">Delete</a>
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>

    <a href="{{ url_for('add_stock') }}">Add New Stock Item</a>
{% endblock %}
