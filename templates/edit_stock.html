{% extends "base.html" %}

{% block content %}
    <h1>Edit Stock Item</h1>

    <form method="post" action="">
        <label for="name">Name:</label>
        <input type="text" name="name" value="{{ item.name }}" required><br>
        
        <label for="category">Category:</label>
        <input type="text" name="category" value="{{ item.category }}"><br>
        
        <label for="current_stock">Current Stock:</label>
        <input type="number" name="current_stock" value="{{ item.current_stock }}" required><br>
        
        <label for="price">Price:</label>
        <input type="number" step=0.01 name="price" value="{{ item.price }}" required><br>
        
        <button type="submit">Update Stock Item</button>
    </form>
{% endblock %}
