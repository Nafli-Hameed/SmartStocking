{% extends "base.html" %}

{% block content %}
    <h1>Inventory Dashboard</h1>
    <form method="post" action="{{ url_for('update_stock') }}">
        <button type="submit">Update Stock Data</button>
    </form>
    
    <table>
        <thead>
            <tr>
                <th>Item</th>
                <th>Category</th>
                <th>Price</th>
                <th>Current Stock</th>
                <th>Threshold</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
            {% for item in items %}
            <tr {% if item.needs_reorder() %}class="reorder"{% endif %}>
                <td>{{ item.name }}</td>
                <td>{{ item.category }}</td>
                <td>£{{ item.price }}</td>
                <td>{{ item.current_stock }}</td>
                <td>{{ item.reorder_threshold }}</td>
                <td>
                    <a href="{{ url_for('stock_forecast', stock_id=item.id) }}">Forecast</a>
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
{% endblock %}
